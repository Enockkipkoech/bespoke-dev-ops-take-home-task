domain = "devops"
tags = ["kubernetes", "typescript", "docker", "ci-cd", "health-checks", "debugging"]

[environment.runtime]
python = "3.12"

[environment.resources]
memory = "512m"
cpu = "1.0"

[verifier]
user = "root"
